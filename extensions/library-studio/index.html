<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Froja Library Studio</title><style>
:root{color-scheme:dark;--bg:#071013;--panel:#101b20;--line:#294047;--text:#e5eeee;--muted:#8ea0a6;--teal:#16c6b9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#17383d,var(--bg) 38%);color:var(--text);font:15px Inter,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:3;display:flex;gap:16px;align-items:center;padding:16px 22px;background:#081216ee;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}header h1{font-size:20px;margin:0}header small{color:var(--muted)}header input{margin-left:auto;width:min(420px,38vw);background:#0d181c;border:1px solid var(--line);border-radius:9px;padding:11px 14px}button{color:inherit;background:#132228;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}button:hover,button.on{border-color:var(--teal);color:#fff}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}aside{padding:18px;border-right:1px solid var(--line);background:#0a1418}aside button{display:block;width:100%;text-align:left;margin-bottom:7px}aside h3{font-size:12px;color:var(--muted);margin-top:25px}.main{padding:20px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:16px}.toolbar span{color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.card{padding:0;overflow:hidden;text-align:left;position:relative}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#05090b}.card .body{padding:10px}.card b,.card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{color:var(--muted);margin-top:5px}.card .star{position:absolute;right:7px;top:7px;background:#071013cc;font-size:19px;padding:4px 8px}.card.selected{outline:2px solid var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;background:#0b1519;color:var(--text);width:min(1100px,94vw);max-height:92vh;padding:0}dialog::backdrop{background:#000b}.detail{display:grid;grid-template-columns:minmax(360px,58%) 1fr}.viewer{background:#030708;overflow:auto;display:grid;place-items:center;min-height:70vh}.viewer img{max-width:100%;transition:.15s}.meta{padding:20px;overflow:auto;max-height:88vh}.meta h2{margin-top:0}.meta label{display:block;color:var(--muted);margin:14px 0 5px}.meta p{white-space:pre-wrap;line-height:1.5}.zoom{display:flex;gap:7px}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.compare img{width:100%;max-height:70vh;object-fit:contain;background:#030708}.empty{padding:60px;text-align:center;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}.detail{grid-template-columns:1fr}.viewer{min-height:45vh}header small{display:none}}
</style></head><body>
<header><div><h1>◈ Froja Library Studio</h1><small>Private local output library · originals remain untouched</small></div><input id="search" placeholder="Search prompt, model or filename…"><button id="rescan">Refresh</button></header>
<div class="layout"><aside><button class="filter on" data-filter="all">All images</button><button class="filter" data-filter="favorites">★ Favorites</button><h3>COLLECTIONS</h3><div id="collections"></div><button id="newCollection">＋ New collection</button></aside><main class="main"><div class="toolbar"><button id="compare" disabled>Compare selected</button><button id="clear">Clear selection</button><span id="status">Loading…</span></div><div id="grid" class="grid"></div></main></div>
<dialog id="detail"><div class="detail"><div class="viewer"><img id="large"></div><div class="meta"><button onclick="detail.close()">Close</button><h2 id="title"></h2><div class="zoom"><button data-z="100">Fit</button><button data-z="150">150%</button><button data-z="250">250%</button></div><label>Model</label><p id="model"></p><label>Settings</label><p id="settings"></p><label>Prompt</label><p id="prompt"></p><label>Negative prompt</label><p id="negative"></p><button id="reuse">Copy settings for Froja</button><button id="addCollection">Add to collection</button></div></div></dialog>
<dialog id="comparison"><div class="meta"><button onclick="comparison.close()">Close comparison</button><h2>Generation comparison</h2><div id="compareGrid" class="compare"></div></div></dialog>
<script>
const state={images:[],selected:new Set(),filter:'all',collection:'',current:null,collections:[]};const $=id=>document.getElementById(id);
async function api(path,options){const r=await fetch(path,options);if(!r.ok)throw new Error((await r.json()).error||r.statusText);return r.json()}
async function load(){const q=encodeURIComponent($('search').value.trim());let url='/api/images?q='+q;if(state.filter==='favorites')url+='&favorite=1';if(state.collection)url+='&collection='+encodeURIComponent(state.collection);state.images=await api(url);render();}
function render(){$('status').textContent=`${state.images.length} images · ${state.selected.size} selected`;$('compare').disabled=state.selected.size<2;$('grid').innerHTML=state.images.map(x=>`<button class="card ${state.selected.has(x.id)?'selected':''}" data-id="${x.id}"><img loading="lazy" src="/api/image?id=${x.id}"><button class="star" data-star="${x.id}">${x.favorite?'★':'☆'}</button><div class="body"><b>${esc(x.filename)}</b><small>${x.width||'?'} × ${x.height||'?'} · ${esc(x.model||'metadata only')}</small></div></button>`).join('')||'<div class="empty">No matching images</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('grid').onclick=async e=>{const star=e.target.closest('[data-star]');if(star){e.stopPropagation();const id=+star.dataset.star,x=state.images.find(v=>v.id===id);await api('/api/favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,favorite:!x.favorite})});x.favorite=x.favorite?0:1;render();return}const card=e.target.closest('[data-id]');if(!card)return;const x=state.images.find(v=>v.id===+card.dataset.id);if(e.ctrlKey||e.shiftKey){state.selected.has(x.id)?state.selected.delete(x.id):state.selected.size<4&&state.selected.add(x.id);render();return}openDetail(x)};
function openDetail(x){state.current=x;$('large').src='/api/image?id='+x.id;$('large').style.width='100%';$('title').textContent=x.filename;$('model').textContent=x.model||'Not embedded';$('settings').textContent=`${x.width||'?'} × ${x.height||'?'} · Seed ${x.seed||'—'} · ${x.steps||'—'} steps · CFG ${x.cfg||'—'} · ${x.sampler||'—'}`;$('prompt').textContent=x.prompt||'Not embedded';$('negative').textContent=x.negative_prompt||'Not embedded';$('detail').showModal()}
document.querySelector('.zoom').onclick=e=>{const z=e.target.dataset.z;if(z)$('large').style.width=z==='100'?'100%':z+'%'};
$('reuse').onclick=async()=>{const data=await api('/api/reuse?id='+state.current.id);await navigator.clipboard.writeText(JSON.stringify(data,null,2));$('reuse').textContent='Copied';setTimeout(()=>$('reuse').textContent='Copy settings for Froja',1200)};
$('rescan').onclick=async()=>{$('status').textContent='Scanning…';await api('/api/scan',{method:'POST'});await load()};$('search').oninput=()=>{clearTimeout(window.st);window.st=setTimeout(load,250)};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.filter=b.dataset.filter;state.collection='';load()});
$('clear').onclick=()=>{state.selected.clear();render()};$('compare').onclick=()=>{$('compareGrid').innerHTML=[...state.selected].map(id=>`<img src="/api/image?id=${id}">`).join('');$('comparison').showModal()};
async function loadCollections(){state.collections=await api('/api/collections');$('collections').innerHTML=state.collections.map(c=>`<button data-collection="${esc(c.name)}">${esc(c.name)} <small>${c.count}</small></button>`).join('');$('collections').onclick=e=>{const b=e.target.closest('[data-collection]');if(b){state.collection=b.dataset.collection;state.filter='all';load()}}}
$('newCollection').onclick=async()=>{const name=prompt('Collection name');if(name){await api('/api/collections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});loadCollections()}};
$('addCollection').onclick=async()=>{if(!state.collections.length)return alert('Create a collection first.');const name=prompt('Collection name',state.collections[0].name);const c=state.collections.find(x=>x.name===name);if(c){await api('/api/collection-items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection_id:c.id,image_id:state.current.id})});await loadCollections()}};
loadCollections();load();
</script></body></html>

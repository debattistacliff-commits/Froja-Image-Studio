name: Bug report
description: Report a reproducible Froja problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private paths, prompts, images, tokens, and model files before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Generate…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Froja version, OS, GPU/VRAM, Python, Node, and ComfyUI versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
